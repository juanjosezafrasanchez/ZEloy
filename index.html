<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEloy - Prescripción</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a;background:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa}
main{max-width:900px;margin:0 auto;padding:24px 16px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
.subtitle{margin:3px 0 22px;color:#667085;font-size:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
label{display:block;font-weight:700;margin-bottom:8px}
textarea{display:block;width:100%;min-height:300px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;resize:vertical;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#17202a;outline:none}
textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.actions{display:flex;gap:10px;margin-top:12px}
button{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#1d4ed8}
button:active{transform:translateY(1px)}
.result-title{font-weight:700;margin-bottom:10px}
#result{white-space:pre-wrap;line-height:1.65;font-size:16px;word-break:break-word;min-height:24px}
.placeholder{color:#98a2b3}
.status{margin-top:9px;color:#667085;font-size:13px}
@media(max-width:600px){main{padding:14px 10px}.card{padding:14px}h1{font-size:27px}textarea{min-height:250px}}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>ZEloy</h1>
    <div class="subtitle">Prescripción</div>
    <label for="input">Pega aquí la prescripción</label>
    <textarea id="input" spellcheck="false" placeholder="Pega aquí el texto de la prescripción..."></textarea>
    <div class="actions">
      <button id="copy">Copiar resultado</button>
    </div>
    <div class="status">El resultado se genera automáticamente.</div>
  </section>

  <section class="card">
    <div class="result-title">Resultado</div>
    <div id="result" class="placeholder">Aquí aparecerá la prescripción filtrada.</div>
  </section>
</main>

<script>
"use strict";

const input = document.getElementById("input");
const result = document.getElementById("result");
const copyButton = document.getElementById("copy");

const MORPHOLOGIES = [
  { code:"caps", words:["capsula","capsulas","cápsula","cápsulas"] },
  { code:"comp", words:["comprimido","comprimidos"] },
  { code:"sobre", words:["sobre","sobres"] },
  { code:"pom", words:["pomada","pomadas"] }
];

const EXCLUDED_LINE_WORDS = [
  /\babsorbente\b/i,
  /\babsorvente\b/i,
  /\bpañal\b/i,
  /\bnutrición\b/i,
  /\bnutricion\b/i,
  /\bnutricional\b/i,
  /\bmedia\b/i
];

const EXTRA_WORDS = [
  /\benvase\b/gi,
  /\benv\b/gi,
  /\bcaja\b/gi,
  /\bprescripci[oó]n\b/gi,
  /\badministraci[oó]n\b/gi,
  /\bv[ií]a\b/gi,
  /\boral\b/gi,
  /\buso\s+externo\b/gi,
  /\buso\s+t[oó]pico\b/gi,
  /\breceta\b/gi,
  /\btratamiento\b/gi
];

function normalizeSpaces(text){
  return text
    .replace(/[“”«»]/g, "")
    .replace(/\s+/g, " ")
    .replace(/\s+([,;:.])/g, "$1")
    .replace(/([,;:.])\s*$/g, "")
    .trim();
}

function parseDate(text){
  const patterns = [
    /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/,
    /\b(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/
  ];

  for(const re of patterns){
    const m = text.match(re);
    if(!m) continue;

    let day, month, year;
    if(m[1].length === 4){
      year = Number(m[1]);
      month = Number(m[2]);
      day = Number(m[3]);
    }else{
      day = Number(m[1]);
      month = Number(m[2]);
      year = Number(m[3]);
      if(year < 100) year += 2000;
    }

    const date = new Date(year, month - 1, day, 12, 0, 0, 0);
    if(date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) continue;

    return {date, index:m.index, length:m[0].length};
  }
  return null;
}

function isWithin30Days(date){
  const today = new Date();
  today.setHours(23,59,59,999);
  const limit = new Date(today);
  limit.setDate(limit.getDate() - 30);
  return date >= limit && date <= today;
}

function formatDate(date){
  return String(date.getDate()).padStart(2,"0") + "/" +
         String(date.getMonth()+1).padStart(2,"0") + "/" +
         date.getFullYear();
}

function excludedLine(line){
  return EXCLUDED_LINE_WORDS.some(re => re.test(line));
}

function detectMorphology(text){
  for(const item of MORPHOLOGIES){
    const escaped = item.words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    const re = new RegExp("\\b(?:" + escaped + ")\\b","i");
    if(re.test(text)) return item.code;
  }
  return "";
}

function removeDate(text){
  const info = parseDate(text);
  if(!info) return {text, date:null};
  return {
    text: text.slice(0,info.index) + " " + text.slice(info.index + info.length),
    date: info.date
  };
}

function getMorphologyPattern(){
  return "(?:caps(?:ula|ulas)?|cápsula(?:s)?|comp(?:rimido|rimidos)?|sobre(?:s)?|pomada(?:s)?)";
}

function extractMealDose(text, meal){
  const unit = "(?:comp(?:rimidos?)?|caps(?:ulas?|ulas?)?|cápsulas?|sobres?|pomadas?|uds?|unidades?)";
  const number = "(\\d+(?:[.,]\\d+)?)";

  const patterns = [
    new RegExp("(?:^|[+;,/]\\s*|\\s)" + number + "\\s*" + unit + "\\s*" + meal + "\\b","ig"),
    new RegExp("(?:^|[+;,/]\\s*|\\s)" + number + "\\s*" + meal + "\\b","ig"),
    new RegExp("\\b" + meal + "\\b","ig")
  ];

  for(const re of patterns){
    const m = re.exec(text);
    if(!m) continue;
    if(m[1] !== undefined) return {value:parseFloat(m[1].replace(",",".")), match:m[0]};
    return {value:1, match:m[0]};
  }
  return null;
}

function mealSchedule(text){
  let value = text;
  const schedule = [0,0,0];
  let found = false;

  const meals = [
    {name:"desayuno", index:0},
    {name:"comida", index:1},
    {name:"cena", index:2}
  ];

  for(const meal of meals){
    const info = extractMealDose(value, meal.name);
    if(info){
      schedule[meal.index] = info.value;
      found = true;
      value = value.replace(info.match, " ");
    }
  }

  if(!found) return {text:value, code:""};

  value = value
    .replace(/\s*\+\s*/g," ")
    .replace(/\s*,\s*/g," ")
    .replace(/\s{2,}/g," ");

  function fmt(n){
    return Number.isInteger(n) ? String(n) : String(n).replace(".",",");
  }

  return {text:value, code:schedule.map(fmt).join("-")};
}

function removePackageQuantities(text){
  const units = "(?:comprimidos?|cápsulas?|capsulas?|sobres?|ampollas?|viales?|tabletas?|grageas?|unidades?|uds?)";
  let value = text;

  value = value.replace(new RegExp("\\b(?:envase|env|caja)\\s*(?:de\\s*)?\\d+\\s*" + units + "\\b","ig")," ");
  value = value.replace(new RegExp("\\b(?:envase|env|caja)\\s*(?:de\\s*)?\\d+\\b","ig")," ");

  return value;
}

function removeUnwanted(text){
  let value = text;

  for(const re of EXTRA_WORDS) value = value.replace(re," ");

  value = value.replace(/[“”«»\"']/g, "");
  value = removePackageQuantities(value);

  return normalizeSpaces(value);
}

function removeMorphologyWords(text){
  let value = text;
  const morphology = getMorphologyPattern();
  value = value.replace(new RegExp("\\b" + morphology + "\\b","ig")," ");
  return normalizeSpaces(value);
}

function removeFrequencyNoise(text){
  let value = text;

  value = value.replace(/\b(?:cada|c\/)\s*\d+\s*(?:h|horas?)\b/gi," ");
  value = value.replace(/\b(?:una|un)\s+vez\s+al\s+d[ií]a\b/gi," ");
  value = value.replace(/\b(?:dos|tres)\s+veces\s+al\s+d[ií]a\b/gi," ");
  value = value.replace(/\b(?:mañana|tarde|noche)\b/gi," ");

  return normalizeSpaces(value);
}

function cleanMedicationLine(line){
  let working = line;

  const dateInfo = removeDate(working);
  working = dateInfo.text;

  const scheduleInfo = mealSchedule(working);
  working = scheduleInfo.text;

  const morphology = detectMorphology(working);

  working = removeUnwanted(working);
  working = removeFrequencyNoise(working);

  /*
     Eliminamos las cantidades que describen el contenido del envase,
     pero NO eliminamos dosis como 500 mg, 875 mg, 1 g, 20 mg/ml, etc.
  */
  working = working.replace(/\b\d+\s*(?:comprimidos?|cápsulas?|capsulas?|sobres?|ampollas?|viales?|tabletas?|grageas?|unidades?|uds?)\b/gi," ");

  /* La morfología se vuelve a añadir en su forma corta. */
  working = removeMorphologyWords(working);
  working = normalizeSpaces(working);

  /*
     Limpieza de separadores que hayan quedado al eliminar información.
  */
  working = working.replace(/^[\s,;:+\-]+|[\s,;:+\-]+$/g,"");
  working = normalizeSpaces(working);

  if(!working) return null;

  if(morphology) working += " " + morphology;
  if(scheduleInfo.code) working += " " + scheduleInfo.code;

  return {
    text: normalizeSpaces(working),
    date: dateInfo.date,
    key: medicationKey(working, morphology)
  };
}

function medicationKey(text, morphology){
  let value = text.toLocaleLowerCase("es-ES");

  if(morphology){
    value = value.replace(new RegExp("\\b" + morphology + "\\b","ig")," ");
  }

  value = value.replace(/\b\d+(?:[.,]\d+)?-\d+(?:[.,]\d+)?-\d+(?:[.,]\d+)?\b/g," ");
  return normalizeSpaces(value);
}

function processAll(){
  const lines = input.value.split(/\r?\n/);
  const medicines = new Map();

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line || excludedLine(line)) continue;

    const item = cleanMedicationLine(line);
    if(!item || !item.key) continue;

    const previous = medicines.get(item.key);
    if(!previous){
      medicines.set(item.key,item);
    }else if(item.date && (!previous.date || item.date > previous.date)){
      medicines.set(item.key,item);
    }
  }

  const items = Array.from(medicines.values());

  items.sort((a,b)=>{
    if(a.date && b.date) return b.date - a.date;
    if(a.date) return -1;
    if(b.date) return 1;
    return a.text.localeCompare(b.text,"es",{sensitivity:"base"});
  });

  const output = items.map(item=>{
    if(item.date && isWithin30Days(item.date)){
      return formatDate(item.date) + " " + item.text;
    }
    return item.text;
  });

  const finalText = output.join("\n");

  if(finalText){
    result.textContent = finalText;
    result.classList.remove("placeholder");
  }else{
    result.textContent = "Aquí aparecerá la prescripción filtrada.";
    result.classList.add("placeholder");
  }

  return finalText;
}

input.addEventListener("input",processAll);

copyButton.addEventListener("click",async()=>{
  const text = processAll();
  if(!text) return;

  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    document.execCommand("copy");
    temp.remove();
  }

  const old = copyButton.textContent;
  copyButton.textContent = "¡Copiado!";
  setTimeout(()=>copyButton.textContent=old,1200);
});
</script>
</body>
</html>
